version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: school_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: school_db
      MARIADB_USER: schooluser
      MARIADB_PASSWORD: schoolpass
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  web:
    build: .
    container_name: xi_tkj_3_web
    depends_on:
      - db
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: schooluser
      DB_PASSWORD: schoolpass
      DB_NAME: school_db
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run seed && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  mariadb-data:
